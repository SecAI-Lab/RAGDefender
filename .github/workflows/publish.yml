name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:  # re-run for a version already on main (uploads skip files that exist)

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build ragdefender
        run: python -m build

      - name: Build llama-index-postprocessor-ragdefender
        run: python -m build packages/llama-index-postprocessor-ragdefender --outdir dist

      - name: Check metadata
        run: twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    # Trusted publishing: both PyPI projects (ragdefender and
    # llama-index-postprocessor-ragdefender) list this repo, this workflow file
    # and the "pypi" environment as a publisher, so no API token lives in the repo.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
