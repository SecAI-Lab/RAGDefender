name: Tests

on:
  push:
    branches: [main, "refactor/**", "feat/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install CPU-only torch
        # Pulled separately so the heavy CUDA wheel is never resolved in CI.
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install package + test deps
        run: pip install -e ".[dev]"

      - name: Run pytest
        env:
          CUDA_VISIBLE_DEVICES: ""        # force CPU; legacy fixtures were captured on CPU
          # RAGDEFENDER_TEST_HEAVY unset → skips Stella embedder tests
          # No framework extras installed → tests/integrations/ self-skip, except
          # the lazy-import tests which assert the ImportError message.
        run: pytest tests/ -v --no-cov

  integrations:
    # Framework adapters (ragdefender/integrations/). All four frameworks need
    # Python >= 3.10, so this job runs on a single modern interpreter.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install CPU-only torch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install package + all framework extras
        # langchain-classic provides ContextualCompressionRetriever (LangChain >= 1.0).
        run: pip install -e ".[dev,integrations]" langchain-classic

      - name: Disable Guardrails telemetry
        # Guardrails validators phone home with anonymous metrics by default.
        run: printf 'id=ci\nenable_metrics=false\nuse_remote_inferencing=false\n' > ~/.guardrailsrc

      - name: Run adapter tests
        env:
          CUDA_VISIBLE_DEVICES: ""
        run: pytest tests/integrations/ -v --no-cov
